<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Front Desk — Usage report</title>
<style>
  :root{
    --navy:#14283D; --teal:#2A807A; --ink:#16202B; --muted:#5E6B78;
    --faint:#68747F; --line:#E4E9EE; --line-soft:#EFF3F6; --wash:#F7F9FA;
    --sans: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; background:#fff; color:var(--ink); font-family:var(--sans);
        font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 24px; }
  header{ background:var(--navy); color:#fff; }
  header .wrap{ padding:22px 24px; display:flex; justify-content:space-between;
                align-items:center; gap:16px; flex-wrap:wrap; }
  header .name{ font-weight:650; font-size:15px; }
  header .period{ font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:#9FB0C1; }
  h1{ font-family:var(--serif); font-weight:400; font-size:1.75rem; color:var(--navy);
      margin:44px 0 4px; letter-spacing:-.01em; }
  .sub{ color:var(--muted); font-size:15px; margin:0 0 34px; }

  .tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:1px;
          background:var(--line); border:1px solid var(--line); border-radius:4px;
          overflow:hidden; margin-bottom:40px; }
  .tile{ background:#fff; padding:22px 20px; }
  .tile .n{ font-family:var(--serif); font-size:2.3rem; line-height:1; color:var(--navy); }
  .tile .k{ display:block; margin-top:9px; font-size:11.5px; letter-spacing:.12em;
            text-transform:uppercase; color:var(--faint); font-weight:600; }
  .tile.accent .n{ color:var(--teal); }

  h2{ font-family:var(--serif); font-weight:400; font-size:1.25rem; color:var(--navy);
      margin:0 0 6px; }
  .note{ color:var(--muted); font-size:14.5px; margin:0 0 18px; }

  table{ width:100%; border-collapse:collapse; font-size:14.5px; margin-bottom:40px; }
  th{ text-align:left; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--faint); font-weight:600; padding:0 10px 10px 0; border-bottom:1px solid var(--line); }
  th:not(:first-child), td:not(:first-child){ text-align:right; }
  td{ padding:11px 10px 11px 0; border-bottom:1px solid var(--line-soft); }
  td.day{ color:var(--muted); }
  .bar{ display:inline-block; height:7px; background:var(--teal); border-radius:2px;
        vertical-align:middle; margin-right:8px; min-width:2px; }

  ul.q{ list-style:none; margin:0 0 40px; padding:0; }
  ul.q li{ font-family:var(--serif); font-size:1.02rem; color:var(--navy);
           padding:11px 0 11px 18px; border-left:2px solid var(--line); margin-bottom:2px; }
  ul.q li span{ display:block; font-family:var(--sans); font-size:12.5px; color:var(--faint); margin-top:4px; }
  /* Selector has to out-specify "ul.q li span", which is display:block. */
  ul.q li span.tag{ display:inline-block; margin-top:0; font-family:var(--sans);
        font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--teal);
        border:1px solid var(--line); border-radius:3px; padding:2px 6px;
        margin-right:8px; vertical-align:2px; }
  td.ref{ font-family:var(--sans); color:var(--navy); }

  .empty{ background:var(--wash); border:1px solid var(--line); border-radius:4px;
          padding:26px; color:var(--muted); font-size:15px; }
  footer{ border-top:1px solid var(--line-soft); margin-top:20px; }
  footer .wrap{ padding:22px 24px 40px; color:var(--faint); font-size:13px; }
  .err{ background:#FDF3F1; border:1px solid #E4C3BB; color:#7A2F1C;
        border-radius:4px; padding:22px; margin:44px 0; font-size:15px; }
  @media (min-width:640px){ .tiles{ grid-template-columns:repeat(4,1fr); } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="name" id="agency">AI Front Desk</span>
    <span class="period" id="period">Usage report</span>
  </div>
</header>

<div class="wrap" id="main">
  <p class="sub" style="margin-top:44px">Loading…</p>
</div>

<footer>
  <div class="wrap">
    Generated by KoveraLink AI Front Desk. Counts cover conversations that reached the
    assistant on your website.
  </div>
</footer>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var agencyId = q.get('agencyId') || '';
  var token = q.get('token') || '';
  var days = q.get('days') || '30';
  var main = document.getElementById('main');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function fail(msg) {
    main.innerHTML = '<div class="err">' + esc(msg) + '</div>';
  }

  if (!agencyId || !token) {
    return fail('This report link is incomplete. It needs both an agency and an access token — ask KoveraLink to resend it.');
  }

  fetch('/api/stats?agencyId=' + encodeURIComponent(agencyId) +
        '&token=' + encodeURIComponent(token) +
        '&days=' + encodeURIComponent(days))
    .then(function (r) {
      if (r.status === 403) throw new Error('That access token is not valid for this report.');
      if (r.status === 404) throw new Error('No report is available for this agency.');
      if (!r.ok) throw new Error('The report could not be loaded right now.');
      return r.json();
    })
    .then(render)
    .catch(function (e) { fail(e.message); });

  function render(d) {
    document.getElementById('agency').textContent = d.agency || 'AI Front Desk';
    document.getElementById('period').textContent = 'Last ' + d.days + ' days';

    var html = '';
    html += '<h1>What your assistant did</h1>';
    html += '<p class="sub">The last ' + d.days + ' days, through ' +
            esc(new Date(d.generatedAt).toLocaleDateString()) + '.</p>';

    html += '<div class="tiles">' +
      tile(d.conversations, 'Conversations') +
      tile(d.leads, 'Leads captured', true) +
      tile(d.urgentLeads, 'Flagged urgent') +
      tile(d.leadRate + '%', 'Became a lead') +
      '</div>';

    var days = Object.keys(d.byDay || {}).sort().reverse().slice(0, 14);
    if (days.length) {
      var peak = Math.max.apply(null, days.map(function (k) { return d.byDay[k].conversations; })) || 1;
      html += '<h2>Day by day</h2><p class="note">Most recent two weeks.</p><table>' +
        '<tr><th>Day</th><th>Conversations</th><th>Leads</th></tr>';
      days.forEach(function (k) {
        var row = d.byDay[k];
        var w = Math.round((row.conversations / peak) * 90);
        html += '<tr><td class="day">' + esc(k) + '</td>' +
                '<td><span class="bar" style="width:' + w + 'px"></span>' + row.conversations + '</td>' +
                '<td>' + row.leads + '</td></tr>';
      });
      html += '</table>';
    }

    // Only ever populated on a tagged demo link, so a client's report never
    // shows this section at all.
    var refs = Object.keys(d.byRef || {}).sort(function (a, b) {
      return d.byRef[b].conversations - d.byRef[a].conversations;
    });
    if (refs.length) {
      html += '<h2>Where they came from</h2>' +
              '<p class="note">Tagged links, busiest first.</p><table>' +
              '<tr><th>Tag</th><th>Conversations</th><th>Leads</th><th>Last seen</th></tr>';
      refs.forEach(function (r) {
        var row = d.byRef[r];
        html += '<tr><td class="ref">' + esc(r) + '</td>' +
                '<td>' + row.conversations + '</td>' +
                '<td>' + row.leads + '</td>' +
                '<td class="day">' + esc(row.last) + '</td></tr>';
      });
      html += '</table>';
    }

    if (d.recentQuestions && d.recentQuestions.length) {
      html += '<h2>What people came in asking</h2>' +
              '<p class="note">The opening question from each conversation, most recent first.</p><ul class="q">';
      d.recentQuestions.slice(0, 25).forEach(function (item) {
        html += '<li>' + (item.ref ? '<span class="tag">' + esc(item.ref) + '</span>' : '') +
                esc(item.text) +
                '<span>' + esc(new Date(item.t).toLocaleString()) + '</span></li>';
      });
      html += '</ul>';
    } else {
      html += '<h2>What people came in asking</h2>' +
              '<div class="empty">No conversations recorded in this period yet.</div>';
    }

    main.innerHTML = html;
  }

  function tile(n, k, accent) {
    return '<div class="tile' + (accent ? ' accent' : '') + '">' +
           '<div class="n">' + esc(n) + '</div><span class="k">' + esc(k) + '</span></div>';
  }
})();
</script>

</body>
</html>
